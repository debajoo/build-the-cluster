  :root {
    color-scheme: light;
    --text: #1b2235;
    --muted: #66708a;
    --line: #e2e7f2;
    --surface: #ffffff;
    --blue: #326ce5;
    --blue-dark: #1e48b0;
    --purple: #326ce5;
    --purple-dark: #1e48b0;
    --good: #16a34a;
    --good-dark: #0f7a36;
    --red: #ff3b3b;
    --bad: #dc2626;
    --wire: #a9badd;
    --shadow: 0 1px 2px rgba(30, 50, 90, .06), 0 10px 26px rgba(30, 60, 120, .08);
    --shadow-3d: 0 3px 0 #dfe5f2, 0 14px 30px rgba(40, 70, 140, .12);
    --shadow-lg: 0 24px 60px rgba(40, 50, 80, .28);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--text);
    background:
      radial-gradient(1100px 520px at 15% -8%, #fff3df 0%, rgba(255,243,223,0) 65%),
      linear-gradient(180deg, #fbf5ec 0%, #f7f1e8 45%, #e8eef9 100%);
    background-attachment: fixed;
    font-family: "Clarity City", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  button { font: inherit; color: inherit; }
  .app { max-width: 1380px; margin: 0 auto; padding: 14px 20px 18px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 22px; margin-top: 12px; align-items: start; }
  .side {
    position: sticky; top: 14px; background: rgba(255, 255, 255, .7); border: 1px solid var(--line);
    border-radius: 20px; padding: 14px 12px; box-shadow: var(--shadow); backdrop-filter: blur(6px);
  }
  .tray-empty { display: none; text-align: center; color: var(--good); font-weight: 700; font-size: 0.9rem; padding: 18px 6px; }
  .tray-empty.show { display: block; }

  /* Header */
  .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand .hex { width: 52px; height: 57px; flex: none; }
  h1 { margin: 0; font-size: 1.6rem; letter-spacing: -0.025em; font-weight: 800; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 0.92rem; }
  .hud { display: flex; align-items: center; gap: 8px; }
  .pill {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 14px; font-weight: 800; font-size: 0.95rem; font-variant-numeric: tabular-nums; box-shadow: var(--shadow-3d);
  }
  .pill small { display: block; font-size: 0.62rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .pill.low { color: var(--bad); border-color: var(--bad); }
  .lives { display: flex; gap: 3px; font-size: 1.35rem; color: var(--bad); padding: 0 6px; }
  .lives .lost { opacity: .15; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    cursor: pointer; display: grid; place-items: center; box-shadow: var(--shadow-3d); font-size: 1.15rem;
  }
  .icon-btn:hover { color: var(--blue); }

  /* Message bar */
  .msg {
    margin-top: 10px; min-height: 44px; padding: 10px 16px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 0.95rem;
    display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow); transition: background .25s, border-color .25s;
  }
  .msg.good { background: #effaf2; border-color: #9ad8ae; color: var(--text); }
  .msg.bad { background: #fff1f1; border-color: #f3a6a6; color: var(--text); }
  .msg.flow { background: #eef3ff; border-color: #a9c0f3; color: var(--text); }
  .msg b { color: var(--blue); }
  .msg.good b { color: var(--good); }
  .msg.power { background: #effaf2; border-color: var(--good); color: var(--text); box-shadow: 0 0 0 4px rgba(22,163,74,.14), var(--shadow); }
  .msg.power b { color: var(--good); }

  /* Stage */
  .stage { position: relative; padding-left: 12px; }
  .wires, .fx { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .wires { z-index: 1; }
  .fx { z-index: 6; }
  .wire { stroke: #9fb1d8; stroke-width: 2.4; stroke-dasharray: 7 7; stroke-linecap: round; fill: none; }
  .wire.live { stroke: var(--blue); stroke-width: 3; stroke-dasharray: 9 7; animation: flow 1.1s linear infinite; }
  .wire.live.wn { stroke: var(--purple); }
  .stage.ready .wire { stroke: var(--good); stroke-dasharray: none; animation: none; stroke-width: 3; }
  .surge-line {
    stroke: #22c55e; stroke-width: 5; stroke-linecap: round; fill: none;
    filter: drop-shadow(0 0 6px rgba(34, 197, 94, .95)) drop-shadow(0 0 14px rgba(34, 197, 94, .5));
    transition: stroke-dashoffset 1s cubic-bezier(.6, 0, .2, 1), stroke 1s, opacity .8s, filter 1s;
  }
  .surge-line.done { stroke: var(--good); stroke-width: 4; filter: drop-shadow(0 0 4px rgba(22, 163, 74, .7)); }
  .surge-line.gone { opacity: 0; }
  .dot { fill: #fff; stroke: var(--blue); stroke-width: 4; filter: drop-shadow(0 0 8px var(--blue)); }

  .client-row { display: block; margin: 4px 0 40px; }
  .client-row .inner { display: block; }
  .client {
    margin-left: 70px; position: relative; z-index: 3;
    display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
    background: var(--surface); border: 1.5px solid #cfdaf0; border-radius: 999px; padding: 10px 20px 10px 14px;
    font-weight: 700; font-size: 1rem; box-shadow: var(--shadow-3d);
  }
  .client svg { width: 24px; height: 24px; color: var(--blue); flex: none; }

  .cluster {
    position: relative; border: 2px dashed #b8c6e3; border-radius: 28px;
    background: rgba(255, 255, 255, .45); padding: 58px 20px 20px; transition: border-color .4s, box-shadow .4s;
  }
  .cluster.charged { animation: charge 4.5s ease; }
  .stage.ready .cluster { border-color: var(--good); border-style: solid; box-shadow: 0 0 0 6px rgba(22,163,74,.08); }
  .cluster-badge { position: absolute; top: -34px; left: -24px; width: 76px; height: 83px; z-index: 4; }
  .cluster-title { position: absolute; top: 18px; left: 64px; font-weight: 800; font-size: 1.05rem; letter-spacing: -0.01em; }
  .cluster-title small { color: var(--muted); font-weight: 600; font-size: 0.8rem; margin-left: 6px; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
  .panel {
    position: relative; border-radius: 22px; padding: 46px 10px 14px; background: rgba(255, 255, 255, .72);
    border: 1.5px solid var(--zone-line); box-shadow: var(--shadow);
  }
  .panel.cp { --zone: var(--blue); --zone-dark: var(--blue-dark); --zone-line: rgba(50, 108, 229, .32); --zone-soft: rgba(50, 108, 229, .08); --zone-ring: rgba(50, 108, 229, .22); }
  .panel.wn { --zone: var(--purple); --zone-dark: var(--purple-dark); --zone-line: rgba(50, 108, 229, .32); --zone-soft: rgba(50, 108, 229, .08); --zone-ring: rgba(50, 108, 229, .22); }
  .tag {
    position: absolute; top: 16px; left: 16px; display: flex; align-items: center; gap: 8px;
    font-size: 0.85rem; font-weight: 800; z-index: 3;
  }
  .tag span { background: var(--zone); color: #fff; padding: 5px 11px; border-radius: 8px; box-shadow: 0 3px 0 var(--zone-dark); }
  .tag small { color: var(--muted); font-weight: 600; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px 30px; align-content: center; height: 100%; }
  .cp-grid { grid-template-areas: "etcd cm" "sched api"; }
  .wn-grid { grid-template-areas: "kubelet runtime" "kproxy pod"; }

  /* Slots */
  .slot {
    position: relative; z-index: 3; min-width: 0; width: 100%; max-width: 210px; justify-self: center;
    background: none; border: 0; padding: 4px; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer;
  }
  .slot:focus-visible { outline: 3px solid var(--zone-ring); outline-offset: 2px; }
  .slot .hex { position: relative; width: 62px; height: 68px; transition: transform .2s ease, filter .2s ease; }
  .slot .hex svg, .card .hex svg, .brand .hex svg, .cluster-badge svg, .modal .hex svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .slot-name {
    display: none; font-weight: 800; font-size: 0.98rem; letter-spacing: -0.01em;
    background: var(--surface); padding: 1px 10px; border-radius: 8px;
  }
  .slot-desc {
    font-size: 0.75rem; line-height: 1.3; color: var(--muted); text-align: center; max-width: 190px;
    background: var(--surface); border: 1.5px solid #e2e8f4; border-radius: 10px; padding: 5px 9px;
    box-shadow: var(--shadow); transition: border-color .18s, background .18s, color .18s;
  }
  .empty-face { fill: #f7f9fe; stroke: #b6c4e2; stroke-width: 2; stroke-dasharray: 5 4; transition: fill .18s, stroke .18s; }
  .empty-side { fill: #e6ebf6; }
  .q { fill: #9aaad0; font-size: 22px; font-weight: 800; transition: fill .18s; }
  .slot:hover:not(.filled) .hex { transform: translateY(-3px); }
  .slot:hover:not(.filled) .slot-desc, .slot.ready .slot-desc { border-color: var(--zone-line); }
  .slot.ready .empty-face { stroke: var(--zone); fill: var(--zone-soft); }
  .slot.ready .q { fill: var(--zone); }
  .slot.hover .hex { transform: scale(1.15); filter: drop-shadow(0 0 12px var(--zone-ring)); }
  .slot.hover .slot-desc { border-color: var(--zone); color: var(--text); box-shadow: 0 0 0 4px var(--zone-ring), var(--shadow); }
  .slot.filled { cursor: default; }
  .slot.filled .slot-name { display: block; }
  .slot.filled .slot-desc { color: var(--text); border-color: var(--zone-line); }
  .slot.pop .hex { animation: pop .45s cubic-bezier(.2, 1.5, .4, 1); }
  .slot.wrong .hex { animation: shake .4s; }
  .slot.wrong .empty-face { stroke: var(--bad); fill: #fff3f3; }
  .slot.wrong .slot-desc { border-color: var(--bad); background: #fff3f3; }
  .slot.active .hex { transform: scale(1.14); filter: drop-shadow(0 0 14px var(--zone)); }
  .slot.active .slot-desc { border-color: var(--zone); box-shadow: 0 0 0 4px var(--zone-ring), var(--shadow); }
  .slot.live .hex { animation: liveHex 1.4s ease-in-out infinite; }
  .slot.live .slot-desc { border-color: var(--good); }
  .check {
    position: absolute; top: -4px; right: -12px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--good); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 0.9rem;
    box-shadow: 0 3px 0 var(--good-dark), 0 6px 14px rgba(22, 163, 74, .4); animation: pop .4s cubic-bezier(.2, 1.6, .4, 1);
  }

  /* Stamp */
  .stamp { position: absolute; inset: 0; z-index: 7; display: grid; place-items: center; pointer-events: none; }
  .stamp-badge {
    position: relative; display: flex; align-items: center; gap: 12px;
    background: #fff; color: var(--good-dark); border: 3px solid var(--good); border-radius: 18px;
    padding: 16px 28px; font-weight: 900; font-size: 1.55rem; letter-spacing: -0.02em;
    box-shadow: 0 5px 0 var(--good-dark), 0 26px 60px rgba(22, 163, 74, .35);
    animation: stampIn .6s cubic-bezier(.2, 1.5, .35, 1) both; transform: rotate(-3deg);
  }
  .stamp-badge .ok { width: 40px; height: 40px; border-radius: 50%; background: var(--good); color: #fff; display: grid; place-items: center; font-size: 1.3rem; }
  .stamp-badge small { display: block; font-size: 0.8rem; font-weight: 600; color: var(--muted); letter-spacing: 0; }
  .stamp-badge::before {
    content: ""; position: absolute; inset: -10px; border-radius: 24px; border: 3px solid var(--good);
    animation: ring 1s ease-out .25s both;
  }
  .stamp.out { animation: fadeOut .4s ease forwards; }

  .confetti { position: absolute; z-index: 9; pointer-events: none; border-radius: 2px; }
  .cluster-badge.party, .brand .hex.party { animation: hop .9s cubic-bezier(.3, 1.6, .5, 1); }

  /* Tray */
  .tray-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 4px 10px; }
  .tray-head h2 { margin: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
  .tray-head span { font-size: 0.88rem; color: var(--muted); font-weight: 600; }
  .tray { display: flex; flex-direction: column; gap: 8px; }
  .card {
    display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 7px; width: 100%; text-align: left;
    background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-3d);
    font-weight: 700; font-size: 0.9rem; cursor: grab; touch-action: none;
    transition: transform .14s, border-color .14s, box-shadow .14s, opacity .14s;
  }
  .card .hex { width: 36px; height: 40px; flex: none; }
  .card:hover { transform: translateX(-3px); border-color: var(--blue); box-shadow: 0 3px 0 #cfdbf5, 0 18px 34px rgba(40, 70, 140, .18); }
  .card:focus-visible { outline: 3px solid rgba(50,108,229,.3); outline-offset: 2px; }
  .card.selected { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(50,108,229,.18), var(--shadow-3d); transform: translateY(-4px); }
  .card.dragging { opacity: .3; }
  .card.shake { animation: shake .4s; border-color: var(--bad); }
  .ghost { position: fixed; z-index: 100; pointer-events: none; margin: 0; transform: rotate(-4deg) scale(1.08); box-shadow: var(--shadow-lg); border-color: var(--blue); }

  /* Overlay */
  .overlay {
    position: fixed; inset: 0; z-index: 90; background: rgba(60, 45, 25, .22); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .overlay.show { display: flex; }
  .modal {
    background: #fffdf9; border: 1px solid #eee4d4; border-radius: 24px; padding: 30px 26px;
    width: 100%; max-width: 450px; text-align: center; box-shadow: var(--shadow-lg); animation: rise .3s ease;
  }
  .modal .hex { width: 72px; height: 79px; margin: 0 auto; }
  .modal h2 { margin: 12px 0 8px; font-size: 1.6rem; letter-spacing: -0.025em; }
  .modal p { margin: 0 0 18px; color: var(--muted); line-height: 1.5; font-size: 0.96rem; }
  .rules { text-align: left; margin: 0 auto 24px; padding: 0; list-style: none; display: grid; gap: 10px; max-width: 330px; }
  .rules li { display: flex; gap: 12px; align-items: flex-start; font-size: 0.93rem; line-height: 1.4; }
  .rules li span {
    flex: none; width: 24px; height: 24px; border-radius: 8px; background: var(--blue); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 0.8rem; box-shadow: 0 2px 0 var(--blue-dark);
  }
  .big { font-size: 2.6rem; font-weight: 900; color: var(--good); letter-spacing: -0.03em; }
  .primary {
    background: var(--blue); color: #fff; border: 0; border-radius: 14px; padding: 14px 34px;
    font-weight: 800; font-size: 1.02rem; cursor: pointer; box-shadow: 0 4px 0 var(--blue-dark), 0 12px 24px rgba(50,108,229,.3);
    transition: transform .1s, box-shadow .1s;
  }
  .primary:hover { filter: brightness(1.06); }
  .primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--blue-dark), 0 6px 14px rgba(50,108,229,.3); }

  @keyframes flow { to { stroke-dashoffset: -32; } }
  @keyframes pop { 0% { transform: scale(.5); } 100% { transform: scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  @keyframes liveHex { 0%,100% { filter: drop-shadow(0 0 0 rgba(22,163,74,0)); transform: scale(1); } 50% { filter: drop-shadow(0 0 16px rgba(22,163,74,.9)); transform: scale(1.08); } }
  @keyframes charge {
    0% { border-color: #b8c6e3; box-shadow: none; }
    30% { border-color: #22c55e; box-shadow: 0 0 0 6px rgba(34,197,94,.18), 0 0 40px rgba(34,197,94,.3); }
    100% { border-color: var(--good); box-shadow: 0 0 0 6px rgba(22,163,74,.08); }
  }
  @keyframes wobble { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @keyframes hop { 0% { transform: none; } 40% { transform: translateY(-18px) rotate(200deg) scale(1.1); } 100% { transform: rotate(360deg); } }
  @keyframes stampIn { 0% { opacity: 0; transform: scale(2.4) rotate(-10deg); } 100% { opacity: 1; transform: scale(1) rotate(-3deg); } }
  @keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
  @keyframes fadeOut { to { opacity: 0; transform: scale(.96); } }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }

  @media (min-width: 901px) and (max-height: 780px) {
    .slot .hex { width: 52px; height: 57px; }
    .slot-desc { font-size: 0.7rem; padding: 3px 7px; }
    .slot-name { font-size: 0.85rem; }
    .grid { gap: 14px 26px; }
    .client-row { margin-bottom: 34px; }
    .top h1 { font-size: 1.3rem; } .sub { display: none; }
  }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .app { padding-bottom: 120px; }
    .side {
      position: fixed; z-index: 60; left: 0; right: 0; bottom: 0; top: auto; border-radius: 18px 18px 0 0;
      padding: 8px 10px 10px; background: rgba(255, 255, 255, .94); box-shadow: 0 -8px 30px rgba(30, 50, 90, .15);
    }
    .tray-head { margin: 0 4px 6px; }
    .tray { flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .card { flex: none; width: auto; }
  }
  @media (max-width: 800px) {
    .panels { grid-template-columns: 1fr; gap: 40px; }
    .grid { gap: 30px 16px; }
    .wn-grid { grid-template-areas: "kubelet kproxy" "runtime pod"; }
    .msg { display: block; line-height: 1.45; }
    .client { margin-left: 56px; }
    .cluster { padding: 56px 12px 14px; }
    .slot .hex { width: 64px; height: 70px; }
    .slot-desc { font-size: 0.74rem; }
    .card { font-size: 0.88rem; padding-right: 13px; }
    .card .hex { width: 38px; height: 42px; }
    h1 { font-size: 1.3rem; }
    .stamp-badge { font-size: 1.2rem; padding: 12px 18px; }

  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e9dff"/><stop offset="1" stop-color="#2c5fd9"/></linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a989ff"/><stop offset="1" stop-color="#6a3de0"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="hex" id="brandIcon"></span>
      <div>
        <h1>Build the Cluster</h1>
        <p class="sub">Drag each component to the job it does. Or tap a component, then tap a slot.</p>
      </div>
    </div>
    <div class="hud">

        <div class="client" id="client">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7.5 10l3 2.5-3 2.5M13 15.5h4"/></svg>

<div class="overlay show" id="overlay"><div class="modal" id="modal"></div></div>

<script>
const COMPONENTS = [
  { id: "api",     name: "API Server",         label: "api",     zone: "cp", desc: "The front door to the Kubernetes API" },
  { id: "etcd",    name: "etcd",               label: "etcd",    zone: "cp", desc: "Stores the cluster's configuration and state" },
  { id: "sched",   name: "Scheduler",          label: "sched",   zone: "cp", desc: "Chooses a node for each unscheduled Pod" },
  { id: "cm",      name: "Controller Manager", label: "c-m",     zone: "cp", desc: "Works to bring the current state in line with the desired state" },
  { id: "kubelet", name: "kubelet",            label: "kubelet", zone: "wn", desc: "Makes sure this node's assigned Pods are running" },
  { id: "kproxy",  name: "kube-proxy",         label: "k-proxy", zone: "wn", desc: "Sets up network rules for Service traffic" },
  { id: "runtime", name: "Container runtime",  label: "cri",     zone: "wn", desc: "Runs the containers on this node" },
  { id: "pod",     name: "Pod",                label: "pod",     zone: "wn", desc: "Holds your app's container or containers" }
];
const ZONE = { cp: "the Control Plane", wn: "the Worker Node" };
const EDGES = [["client","api"],["api","etcd"],["api","sched"],["api","cm"],["api","kubelet"],["api","kproxy"],["kubelet","runtime"],["runtime","pod"]];
const CHECK_ORDER = ["api", "etcd", "sched", "cm", "kubelet", "kproxy", "runtime", "pod"];
const FLOW = [
  { from: "client", to: "api",     active: ["api"],               text: "1/6 You ask for a Pod. The request goes to the API Server." },
  { from: "api",    to: "etcd",    active: ["api", "etcd"],       text: "2/6 The API Server saves the new Pod in etcd." },
  { from: "sched",  to: "api",     active: ["sched", "api"],      text: "3/6 The Scheduler picks a node and records the choice through the API Server." },
  { from: "api",    to: "kubelet", active: ["kubelet"],           text: "4/6 The kubelet sees a Pod assigned to its node." },
  { from: "kubelet",to: "runtime", active: ["kubelet", "runtime"],text: "5/6 The kubelet tells the container runtime to start the containers." },
  { from: "runtime",to: "pod",     active: ["pod"],               text: "6/6 Your Pod is running." }
];
const TOTAL_TIME = 60, MAX_LIVES = 3;
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 3D heptagon icons ---------- */
function hept(cx, cy, r) {
  const p = [];
  for (let i = 0; i < 7; i++) { const a = -Math.PI / 2 + i * 2 * Math.PI / 7; p.push((cx + r * Math.cos(a)).toFixed(1) + "," + (cy + r * Math.sin(a)).toFixed(1)); }
  return p.join(" ");
}
const FACE = hept(32, 32, 29), SIDE = hept(32, 37, 29);
const GLYPH = {
  api:     '<path d="M25 19l-7 8 7 8M39 19l7 8-7 8M35 16l-6 22"/>',
  etcd:    '<ellipse cx="32" cy="18.5" rx="8.5" ry="3.2"/><path d="M23.5 18.5v15c0 1.8 3.8 3.2 8.5 3.2s8.5-1.4 8.5-3.2v-15"/><path d="M23.5 26c0 1.8 3.8 3.2 8.5 3.2s8.5-1.4 8.5-3.2"/>',
  sched:   '<circle cx="32" cy="27" r="10"/><path d="M32 21v6l4.5 3"/>',
  cm:      '<path d="M41 24.5a9.5 9.5 0 1 0 .3 6"/><path d="M42 17.5v7h-7"/>',
  kubelet: '<rect x="22.5" y="17.5" width="19" height="19" rx="3.5"/><path d="M27 27.5l3.6 3.6 6.6-7.6"/>',
  kproxy:  '<path d="M19.5 27h9M28.5 27l8.5-7.5M28.5 27l8.5 7.5"/><path d="M32.5 19.5h4.5V24M32.5 34.5h4.5V30"/>',
  runtime: '<rect x="21.5" y="16" width="21" height="6" rx="1.6"/><rect x="21.5" y="24" width="21" height="6" rx="1.6"/><rect x="21.5" y="32" width="21" height="6" rx="1.6"/>',
  pod:     '<path d="M32 16.5l9.5 5.3v10.6L32 37.7l-9.5-5.3V21.8z"/><path d="M22.5 21.8l9.5 5.3 9.5-5.3M32 27.1v10.6"/>',
  cluster: '<circle cx="32" cy="18" r="4.5"/><circle cx="22.5" cy="33" r="4.5"/><circle cx="41.5" cy="33" r="4.5"/><path d="M29.6 21.8l-4.7 7.4M34.4 21.8l4.7 7.4M27 33h10"/>'
};
function icon(id, label, tone = "b") {
  const side = tone === "p" ? "#4b25a8" : "#1e48b0";
  const grad = tone === "p" ? "url(#gp)" : "url(#gb)";
  const fs = label.length > 5 ? 7.4 : 8.6;
  return `<svg viewBox="0 0 64 70" aria-hidden="true">
    <ellipse cx="32" cy="66" rx="22" ry="3.5" fill="rgba(30,50,100,.16)"/>
    <polygon points="${SIDE}" fill="${side}" stroke="${side}" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="${FACE}" fill="${grad}" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="32" cy="13" rx="15" ry="6" fill="#fff" opacity=".18"/>
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${GLYPH[id]}</g>
    <text x="32" y="50" text-anchor="middle" font-size="${fs}" font-weight="800" fill="#fff" font-family="'Clarity City', system-ui, sans-serif">${label}</text>
  </svg>`;
}
const EMPTY = `<svg viewBox="0 0 64 70" aria-hidden="true">
  <polygon class="empty-side" points="${hept(32, 36, 28)}"/>
  <polygon class="empty-face" points="${hept(32, 32, 28)}"/>
  <text class="q" x="32" y="40" text-anchor="middle" font-family="'Clarity City', system-ui, sans-serif">?</text></svg>`;

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
const byId = Object.fromEntries(COMPONENTS.map(c => [c.id, c]));
const stage = $("stage"), NS = "http://www.w3.org/2000/svg";
const wait = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 150) : ms));
const slotEl = id => document.querySelector(`.slot[data-id="${id}"]`);
const lower = s => s.charAt(0).toLowerCase() + s.slice(1);
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function setMsg(html, kind = "") { const m = $("msg"); m.innerHTML = html; m.className = "msg" + (kind ? " " + kind : ""); }
function replay(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

let state = { run: 0 };

/* ---------- Geometry and wires ---------- */
function box(key, s) {
  const isClient = key === "client";
  const r = (isClient ? $("client") : slotEl(key).querySelector(".hex")).getBoundingClientRect();
  if (!isClient) return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.width * 32 / 64, hw: 0, hh: 0, rad: r.width * 0.47 };
  return { x: r.left - s.left + r.width / 2, y: r.top - s.top + r.height / 2, hw: r.width / 2, hh: r.height / 2 };
}
function edgeCoords(a, b) {
  const s = stage.getBoundingClientRect(), A = box(a, s), B = box(b, s);
  const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1, ux = dx / len, uy = dy / len;
  const cut = (P) => P.rad ? P.rad + 4 : Math.min(Math.abs(ux) > 1e-6 ? P.hw / Math.abs(ux) : Infinity, Math.abs(uy) > 1e-6 ? P.hh / Math.abs(uy) : Infinity) + 3;
  const ta = cut(A), tb = cut(B);
  return { x1: A.x + ux * ta, y1: A.y + uy * ta, x2: B.x - ux * tb, y2: B.y - uy * tb, ok: len > ta + tb + 6 };
}
const isFilled = k => k === "client" || state.filled.has(k);
function sizeSvgs() {
  const s = stage.getBoundingClientRect();
  ["wires", "fx"].forEach(id => { $(id).setAttribute("width", s.width); $(id).setAttribute("height", s.height); });
}
function line(c, cls) {
  const l = document.createElementNS(NS, "line");
  l.setAttribute("x1", c.x1); l.setAttribute("y1", c.y1); l.setAttribute("x2", c.x2); l.setAttribute("y2", c.y2);
  l.setAttribute("class", cls);
  return l;
}
function drawWires() {
  sizeSvgs();
  const layer = $("wireLayer"); layer.innerHTML = "";
  for (const [a, b] of EDGES) {
    const c = edgeCoords(a, b); if (!c.ok) continue;
    const live = isFilled(a) && isFilled(b);
    const wn = byId[b] && byId[b].zone === "wn";
    layer.appendChild(line(c, "wire" + (live ? " live" : "") + (wn ? " wn" : "")));
  }
}
new ResizeObserver(() => state.filled && drawWires()).observe(stage);

function travel(a, b, dur) {
  return new Promise(res => {
    const c = edgeCoords(a, b);
    const dot = document.createElementNS(NS, "circle");
    dot.setAttribute("r", 8); dot.setAttribute("class", "dot");
    $("dotLayer").appendChild(dot);
    const t0 = performance.now(), d = REDUCED ? 1 : dur;
    (function frame(t) {
      const k = Math.min(1, (t - t0) / d), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      dot.setAttribute("cx", c.x1 + (c.x2 - c.x1) * e); dot.setAttribute("cy", c.y1 + (c.y2 - c.y1) * e);
      if (k < 1) requestAnimationFrame(frame); else { dot.remove(); res(); }
    })(t0);
  });
}

/* ---------- Build ---------- */
function build() {
  ["cp", "wn"].forEach(z => {
    $("grid-" + z).innerHTML = COMPONENTS.filter(c => c.zone === z).map(c => `
      <button class="slot" data-id="${c.id}" style="grid-area:${c.id}" aria-label="Empty slot: ${c.desc}">
        <div class="hex">${EMPTY}</div>
        <div class="slot-name">${c.name}</div>
        <div class="slot-desc">${c.desc}</div>
      </button>`).join("");
  });
  $("tray").innerHTML = shuffle(COMPONENTS).map(c => `
    <button class="card" data-id="${c.id}" aria-label="${c.name}">
      <span class="hex">${icon(c.id, c.label)}</span>${c.name}
    </button>`).join("");
  document.querySelectorAll(".slot").forEach(s => s.addEventListener("click", () => {
    if (state.started && state.selected) attempt(state.selected, s);
  }));
  document.querySelectorAll(".card").forEach(attachDrag);
}

function renderHud() {
  $("lives").innerHTML = Array.from({ length: MAX_LIVES }, (_, i) => `<span class="${i < state.lives ? "" : "lost"}">♥</span>`).join("");
  $("timer").textContent = state.timeLeft + "s";
  $("timerPill").classList.toggle("low", state.started && state.timeLeft <= 10);
  $("progress").textContent = `${state.filled.size}/${COMPONENTS.length}`;
  const left = COMPONENTS.length - state.filled.size;
  $("trayCount").textContent = left ? `${left} left` : "";
  $("trayEmpty").classList.toggle("show", left === 0);
}

function reset() {
  state.run = (state.run || 0) + 1;
  clearInterval(state.timerId);
  $("dotLayer").innerHTML = ""; $("surgeLayer").innerHTML = "";
  document.querySelectorAll(".stamp, .confetti").forEach(s => s.remove());
  stage.classList.remove("ready"); $("cluster").classList.remove("charged");
  state = { run: state.run, started: false, lives: MAX_LIVES, timeLeft: TOTAL_TIME, filled: new Set(), selected: null, timerId: null, startedAt: 0, suppressClick: false };
  build(); renderHud();
  $("trayHead").style.display = ""; $("tray").style.display = "";
  requestAnimationFrame(drawWires);
}

function start() {
  reset();
  state.started = true;
  state.startedAt = Date.now();
  $("overlay").classList.remove("show");
  setMsg("Go! Match each component to its job.");
  state.timerId = setInterval(() => {
    state.timeLeft--; renderHud();
    if (state.timeLeft <= 0) lose("Time's up!");
  }, 1000);
}

/* ---------- Play ---------- */
function select(card) {
  document.querySelectorAll(".card.selected").forEach(c => c.classList.remove("selected"));
  document.querySelectorAll(".slot.ready").forEach(s => s.classList.remove("ready"));
  state.selected = card;
  if (card) {
    card.classList.add("selected");
    document.querySelectorAll(".slot:not(.filled)").forEach(s => s.classList.add("ready"));
    setMsg(`<b>${byId[card.dataset.id].name}</b> selected. Now tap the slot that matches its job.`);
  }
}

function attempt(card, slot) {
  if (!state.started || slot.classList.contains("filled")) return;
  const c = byId[card.dataset.id], target = byId[slot.dataset.id];
  select(null);

  if (c.id === target.id) {
    slot.classList.add("filled");
    slot.querySelector(".hex").innerHTML = icon(c.id, c.label);
    slot.setAttribute("aria-label", `${c.name}: ${c.desc}`);
    replay(slot, "pop");
    card.remove();
    state.filled.add(c.id);
    renderHud(); drawWires();
    setMsg(`Correct! <b>${c.name}</b> ${lower(c.desc)}.`, "good");
    if (state.filled.size === COMPONENTS.length) win();
    return;
  }

  state.lives--; renderHud();
  replay(card, "shake"); replay(slot, "wrong");
  const where = c.zone !== target.zone ? ` It lives on ${ZONE[c.zone]}.` : "";
  setMsg(`Not quite. <b>${c.name}</b> ${lower(c.desc)}.${where}`, "bad");
  if (state.lives <= 0) lose("Out of lives!");
}

function attachDrag(card) {
  let drag = null;
  card.addEventListener("pointerdown", e => {
    if (!state.started || e.button > 0) return;
    state.suppressClick = false;
    card.setPointerCapture(e.pointerId);
    const r = card.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, ghost: null, hover: null };
  });
  card.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.ghost && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
      select(null);
      drag.ghost = card.cloneNode(true);
      drag.ghost.classList.remove("shake", "selected");
      drag.ghost.classList.add("ghost");
      document.body.appendChild(drag.ghost);
      card.classList.add("dragging");
      document.querySelectorAll(".slot:not(.filled)").forEach(s => s.classList.add("ready"));
    }
    if (drag.ghost) {
      drag.ghost.style.left = (e.clientX - drag.dx) + "px";
      drag.ghost.style.top = (e.clientY - drag.dy) + "px";
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const slot = el && el.closest(".slot:not(.filled)");
      if (drag.hover && drag.hover !== slot) drag.hover.classList.remove("hover");
      if (slot) slot.classList.add("hover");
      drag.hover = slot;
    }
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.ghost) return;
    state.suppressClick = true;
    d.ghost.remove();
    card.classList.remove("dragging");
    document.querySelectorAll(".slot.ready").forEach(s => s.classList.remove("ready"));
    if (d.hover) { d.hover.classList.remove("hover"); attempt(card, d.hover); }
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
  card.addEventListener("click", () => {
    if (!state.started) return;
    if (state.suppressClick) { state.suppressClick = false; return; }
    select(state.selected === card ? null : card);
  });
}

document.addEventListener("keydown", e => { if (e.key === "Escape" && state.selected) { select(null); setMsg("Selection cleared."); } });

function stop() { state.started = false; clearInterval(state.timerId); select(null); renderHud(); }

/* ---------- Win sequence ---------- */
async function surge() {
  const layer = $("surgeLayer"); layer.innerHTML = "";
  const lines = EDGES.map(([a, b]) => {
    const c = edgeCoords(a, b);
    const l = line(c, "surge-line");
    const len = Math.hypot(c.x2 - c.x1, c.y2 - c.y1);
    l.style.strokeDasharray = len; l.style.strokeDashoffset = len;
    layer.appendChild(l);
    return l;
  });
  void layer.getBoundingClientRect();
  lines.forEach((l, i) => { l.style.transitionDelay = (i * 0.38) + "s, 0s, 0s, 0s"; l.style.strokeDashoffset = 0; });
  await wait(EDGES.length * 380 + 1200);
  return lines;
}


function anim(el, frames, opts) {
  const a = el.animate(frames, { ...opts, duration: REDUCED ? 1 : opts.duration, fill: "forwards" });
  return a.finished;
}
function confetti(host, x, y, n = 46) {
  const colors = ["#22c55e", "#16a34a", "#326ce5", "#6e9dff", "#ffcc4d", "#ffffff"];
  for (let i = 0; i < n; i++) {
    const c = document.createElement("span");
    c.className = "confetti";
    const w = 6 + Math.random() * 7, h = Math.random() < .5 ? w : w * 0.45;
    Object.assign(c.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px",
      background: colors[i % colors.length], borderRadius: Math.random() < .35 ? "50%" : "2px",
      boxShadow: "0 0 0 1px rgba(20,40,90,.08)" });
    host.appendChild(c);
    const ang = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 190;
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist * 0.75 - 60;
    anim(c, [
      { transform: "translate(-50%,-50%) rotate(0) scale(1)", opacity: 1 },
      { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) rotate(${Math.random() * 720 - 360}deg) scale(1)`, opacity: 1, offset: .6 },
      { transform: `translate(calc(-50% + ${dx * 1.1}px), calc(-50% + ${dy + 120}px)) rotate(${Math.random() * 900}deg) scale(.6)`, opacity: 0 }
    ], { duration: 1500 + Math.random() * 700, easing: "cubic-bezier(.15,.7,.3,1)" }).then(() => c.remove());
  }
}

async function win() {
  stop();
  const run = state.run, alive = () => run === state.run;
  const secs = ((Date.now() - state.startedAt) / 1000).toFixed(1);

  setMsg("<b>All components placed.</b> Powering up the cluster...", "power");
  await wait(1200); if (!alive()) return;
  $("cluster").classList.add("charged");
  const lines = await surge(); if (!alive()) return;

  for (const id of CHECK_ORDER) {
    const s = slotEl(id); const ck = document.createElement("span");
    ck.className = "check"; ck.textContent = "✓"; s.querySelector(".hex").appendChild(ck);
    await wait(320); if (!alive()) return;
  }

  lines.forEach(l => { l.style.transitionDelay = "0s"; l.classList.add("done"); });
  stage.classList.add("ready");
  const stamp = document.createElement("div");
  stamp.className = "stamp";
  stamp.innerHTML = `<div class="stamp-badge"><span class="ok">✓</span><div>Cluster is ready<small>8/8 components connected</small></div></div>`;
  $("cluster").appendChild(stamp);
  setMsg("<b>Cluster is ready.</b> Every component is in place and connected.", "good");
  confetti($("cluster"), $("cluster").clientWidth / 2, $("cluster").clientHeight / 2);
  [$("clusterBadge"), $("brandIcon")].forEach(el => replay(el, "party"));
  await wait(3200); if (!alive()) return;

  stamp.classList.add("out");
  lines.forEach(l => l.classList.add("gone"));
  await wait(450); if (!alive()) return;
  stamp.remove(); $("surgeLayer").innerHTML = "";

  for (const step of FLOW) {
    if (!alive()) return;
    document.querySelectorAll(".slot.active").forEach(s => s.classList.remove("active"));
    step.active.forEach(id => slotEl(id).classList.add("active"));
    setMsg(`<b>Simplified Pod startup</b> ${step.text}`, "flow");
    await travel(step.from, step.to, 1300);
    await wait(1000);
  }
  if (!alive()) return;
  document.querySelectorAll(".slot.active").forEach(s => s.classList.remove("active"));
  slotEl("pod").classList.add("live");
  setMsg("<b>Your Pod is running.</b> Nice work.", "good");
  await wait(2200); if (!alive()) return;

  showModal(`
    <div class="hex logo">${logoHTML()}</div>
    <h2>Cluster built!</h2>
    <div class="big">${secs}s</div>
    <p>${state.lives} of ${MAX_LIVES} lives left. Can you beat your time?</p>
    <button class="primary" id="go">Play again</button>`);
}

function lose(reason) {
  stop();
  setMsg(reason, "bad");
  showModal(`
    <h2>${reason}</h2>
    <p>You placed ${state.filled.size} of ${COMPONENTS.length} components. The slots you filled stay visible, so take a look and try again.</p>
    <button class="primary" id="go">Play again</button>`);
}

function showModal(html) {
  $("modal").innerHTML = html;
  $("overlay").classList.add("show");
  $("go").addEventListener("click", start);
  $("go").focus();
}

/* ---------- Init ---------- */
const logoHTML = () => icon("cluster", "cluster");
$("brandIcon").innerHTML = logoHTML();
$("clusterBadge").innerHTML = logoHTML();
$("restartBtn").addEventListener("click", start);
reset();
showModal(`
  <div class="hex logo">${logoHTML()}</div>
  <h2>Build the Cluster</h2>
  <p>Put all 8 Kubernetes components where they belong.</p>
  <ul class="rules">
    <li><span>1</span>Each slot shows a job. Drop the component that does it.</li>
    <li><span>2</span>Drag, or tap a component and then a slot.</li>
    <li><span>3</span>60 seconds. 3 wrong drops and you're out.</li>
  </ul>
  <button class="primary" id="go">Start</button>`);
</script>
</body>
</html>
